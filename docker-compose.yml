services:
  trending-backend:
    image: ghcr.io/researchpulse/scientificjournalsystem_trending_be:latest
    container_name: researchpulse_trending_backend
    restart: unless-stopped
    ports:
      - "3000:3000" 
    env_file:
      - .env
    networks:
      - researchpulse_network

networks:
  researchpulse_network:
    external: true
    name: researchpulse_network